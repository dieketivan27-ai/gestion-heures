version: '3.9'

services:

  # ============================================================
  # MySQL Database
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: gestion_heures_mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: RootPass2024!
      MYSQL_DATABASE: gestion_heures
      MYSQL_USER: gestion_user
      MYSQL_PASSWORD: GestionHeures2024!
    ports:
      - "3306:3306"   # Accessible depuis MySQL Workbench
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "gestion_user", "-pGestionHeures2024!"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ============================================================
  # Node.js Backend API
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestion_heures_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: gestion_user
      DB_PASSWORD: GestionHeures2024!
      DB_NAME: gestion_heures
      JWT_SECRET: S3cr3tK3y_G3stion_H3ur3s_2024_Sup3r_S3cur3!
      JWT_EXPIRES_IN: 30m
      CORS_ORIGIN: http://localhost
    ports:
      - "8081:3000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - uploads_data:/app/src/uploads
    networks:
      - app_network

  # ============================================================
  # Angular Frontend (build + Nginx)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestion_heures_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local
