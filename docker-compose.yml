services:

  # ============================================================
  # PostgreSQL 16 Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: gestion_heures_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestion_heures
      POSTGRES_USER: gestion_user
      POSTGRES_PASSWORD: GestionHeures2024!
    ports:
      - "5432:5432"   # Accessible depuis DBeaver / pgAdmin
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestion_user -d gestion_heures"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ============================================================
  # Node.js Backend API
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestion_heures_backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://gestion_user:GestionHeures2024!@postgres:5432/gestion_heures
      JWT_SECRET: ${JWT_SECRET:-S3cr3tK3y_G3stion_H3ur3s_2024_Sup3r_S3cur3!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      APP_URL: ${APP_URL:-http://localhost}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_SECURE: ${MAIL_SECURE:-true}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-GestionHeures <no-reply@gestionheures.com>}
    ports:
      - "8081:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - uploads_data:/app/src/uploads
    networks:
      - app_network

  # ============================================================
  # Angular Frontend (build + Nginx)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestion_heures_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
