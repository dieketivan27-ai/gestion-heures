databases:
  - name: gestion-heures-db
    plan: free
    region: frankfurt
    databaseName: gestion_heures
    user: gestion_user

services:
  - type: web
    name: gestion-heures-backend
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-heures-db
          property: connectionString
      - key: PORT
        value: "8080"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30m
      - key: FRONTEND_URL
        value: https://gestion-heures-gold.vercel.app
      - key: APP_URL
        value: https://gestion-heures-gold.vercel.app
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_SECURE
        value: "true"
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_FROM
        value: "GestionHeures <no-reply@gestionheures.com>"